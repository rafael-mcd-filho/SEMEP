  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scrollbar-gutter: stable; }
    body { overflow-x: hidden; font-family: 'Inter', system-ui, sans-serif; }

    :root {
      --font-serif: "Source Serif 4", Georgia, serif;
      --font-sans: "Inter", system-ui, sans-serif;
    }
    .font-serif { font-family: var(--font-serif) !important; }
    .font-sans { font-family: var(--font-sans) !important; }

    /* ── Scroll reveal ─────────────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s cubic-bezier(0.16,1,0.3,1), transform 0.65s cubic-bezier(0.16,1,0.3,1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: 0.08s; }
    .reveal-d2 { transition-delay: 0.16s; }
    .reveal-d3 { transition-delay: 0.24s; }
    .reveal-d4 { transition-delay: 0.32s; }
    .reveal-d5 { transition-delay: 0.40s; }

    /* ── Hero blob ─────────────────────────────────────────────────── */
    .hero-blob {
      border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%;
      background: #0E2A47;
    }

    /* ── Specialty card hover ──────────────────────────────────────── */
    .spec-card img { transition: transform 0.5s ease; }
    .spec-card:hover img { transform: scale(1.06); }

    /* ── Accordion ─────────────────────────────────────────────────── */
    .faq-toggle {
      border-radius: 16px;
      outline: none;
    }
    .faq-toggle:focus { outline: none; }
    .faq-toggle:focus-visible {
      outline: 2px solid rgba(110,201,224,.85);
      outline-offset: 3px;
    }
    .acc-body {
      display: grid;
      grid-template-rows: 0fr;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition: grid-template-rows .48s cubic-bezier(.22,1,.36,1), opacity .28s ease, transform .48s cubic-bezier(.22,1,.36,1);
    }
    .acc-body.open {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0);
    }
    .acc-panel {
      min-height: 0;
      overflow: hidden;
    }
    .acc-panel > p {
      margin: 0;
      transform: translateY(-6px);
      transition: transform .48s cubic-bezier(.22,1,.36,1);
    }
    .acc-body.open .acc-panel > p { transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) {
      .acc-body,
      .acc-panel > p {
        transition: none;
        transform: none;
      }
    }

    /* ── Scrollbar hide ────────────────────────────────────────────── */
    .spec-scroll::-webkit-scrollbar { display: none; }
    .spec-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    /* ── Background textures ────────────────────────────────────────── */
    .bg-dots {
      background-color: #F4F8FB;
      background-image: radial-gradient(circle, rgba(14,42,71,0.065) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .bg-lines {
      background-color: #F4F8FB;
      background-image: repeating-linear-gradient(
        -45deg, transparent, transparent 14px,
        rgba(14,42,71,0.03) 14px, rgba(14,42,71,0.03) 15px
      );
    }
    .hero-gradient { background: linear-gradient(135deg, #E8F2FA 0%, #F4F8FB 55%, #ECF6F9 100%); }
    .card-dark { background: rgba(255,255,255,0.07) !important; border-color: rgba(255,255,255,0.12) !important; }
    .card-dark:hover { background: rgba(255,255,255,0.12) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.25) !important; }

    /* Ritmo mais compacto entre seções */
    section.py-24 { padding-top: 4.5rem !important; padding-bottom: 4.5rem !important; }
    section.py-20 { padding-top: 4rem !important; padding-bottom: 4rem !important; }
    section.py-16 { padding-top: 3.25rem !important; padding-bottom: 3.25rem !important; }
    @media (max-width: 767px) {
      section.py-24 { padding-top: 3.75rem !important; padding-bottom: 3.75rem !important; }
      section.py-20 { padding-top: 3.5rem !important; padding-bottom: 3.5rem !important; }
      section.py-16 { padding-top: 3rem !important; padding-bottom: 3rem !important; }
    }

    /* ── Doctor card ───────────────────────────────────────────────── */
    .doc-card { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .doc-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(14,42,71,0.16); }

    /* ─────────────────────────────────────────────────────────────── */
    /*  TRUST BAR                                                      */
    /* ─────────────────────────────────────────────────────────────── */
    .trust-bar {
      background: #0E2A47;
      padding: 14px 0;
      overflow: hidden;
      border-top:    1px solid rgba(110,201,224,0.12);
      border-bottom: 1px solid rgba(110,201,224,0.12);
      position: relative;
    }
    .trust-bar::before,
    .trust-bar::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 120px;
      z-index: 2;
      pointer-events: none;
    }
    .trust-bar::before { left:  0; background: linear-gradient(to right, #0E2A47, transparent); }
    .trust-bar::after  { right: 0; background: linear-gradient(to left,  #0E2A47, transparent); }

    .trust-track {
      display: flex;
      width: max-content;
      animation: trustScroll 50s linear infinite;
    }
    .trust-track:hover { animation-play-state: paused; }

    @keyframes trustScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .trust-item {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      padding: 0 36px;
      font-family: 'Inter', sans-serif;
      cursor: default;
    }
    .trust-item:hover { color: white; }
    .trust-item svg { width: 15px; height: 15px; color: #6EC9E0; flex-shrink: 0; }
    .trust-sep { color: #6EC9E0; font-size: 18px; opacity: 0.5; line-height: 1; }

    /* ─────────────────────────────────────────────────────────────── */
    /*  TUBELIGHT NAVBAR                                               */
    /* ─────────────────────────────────────────────────────────────── */
    .tl-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 14px 24px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(14,42,71,0.08);
      transition: padding 0.3s, background 0.2s, box-shadow 0.2s;
    }
    .tl-nav.scrolled {
      padding: 8px 24px;
      background: rgba(255,255,255,0.97);
      box-shadow: 0 4px 24px rgba(14,42,71,0.06);
    }
    .tl-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .tubelight-pill {
      display: none;
      align-items: center;
      gap: 2px;
      background: rgba(14,42,71,0.04);
      border: 1px solid rgba(14,42,71,0.08);
      padding: 5px;
      border-radius: 9999px;
      box-shadow: 0 4px 24px rgba(14,42,71,0.06);
    }
    @media (min-width: 1280px) {
      .tubelight-pill { display: flex; }
    }
    .tubelight-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 15px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(14,42,71,0.6);
      text-decoration: none;
      transition: color 0.2s;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }
    .tubelight-link:hover { color: rgba(14,42,71,0.95); }
    .tubelight-link.tl-active {
      color: white;
      background: rgba(30,73,118,0.95);
    }
    /* Glow bar on top */
    .tubelight-link.tl-active::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 3px;
      background: #6EC9E0;
      border-radius: 0 0 4px 4px;
      box-shadow:
        0 0 8px  2px rgba(110,201,224,0.7),
        0 0 20px 4px rgba(110,201,224,0.35),
        0 0 40px 8px rgba(110,201,224,0.15);
    }
    /* Glow radial halo */
    .tubelight-link.tl-active::after {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 20px;
      background: radial-gradient(ellipse at top, rgba(110,201,224,0.22) 0%, transparent 70%);
      border-radius: 50%;
    }
    /* Dropdown */
    .tl-dropdown { position: relative; }
    .tl-drop-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(14,42,71,0.14);
      border: 1px solid rgba(14,42,71,0.07);
      padding: 6px;
      min-width: 190px;
      z-index: 200;
    }
    .tl-drop-item {
      display: block;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 500;
      color: #1A2937;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.15s, color 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .tl-drop-item:hover { background: #F4F8FB; color: #0E2A47; }

    /* Mobile fullscreen menu */
    .tl-mobile-overlay {
      position: fixed;
      inset: 0;
      background: #0E2A47;
      z-index: 500;
      display: flex;
      flex-direction: column;
      padding: 14px 24px 28px;
      overflow-y: auto;
      overscroll-behavior: contain;
      animation: menuFade 0.16s ease-out both;
    }
    @keyframes menuFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .tl-mobile-link {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: white;
      text-decoration: none;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: block;
      transition: color 0.2s;
    }
    .tl-mobile-link:hover { color: #6EC9E0; }

    /* ─────────────────────────────────────────────────────────────── */
    /*  NEON BUTTONS                                                   */
    /* ─────────────────────────────────────────────────────────────── */
    .neon-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      border-radius: 9999px;
      border: 1.5px solid transparent;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      transition:
        padding 0.5s cubic-bezier(0.4,0,0.2,1),
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }
    .neon-btn.neon-block { display: flex; width: 100%; justify-content: center; }

    .neon-btn .btn-text {
      position: relative;
      z-index: 1;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .neon-btn .btn-circle {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: right 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .neon-btn .btn-circle svg {
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .neon-btn:hover .btn-circle svg { transform: rotate(45deg); }
    .neon-btn:active { transform: scale(0.97); opacity: 0.92; }
    .neon-btn:active .btn-circle svg { transform: rotate(45deg); }

    /* Solid (WhatsApp green) */
    .neon-solid {
      background: #25D366;
      color: white;
      border-color: #25D366;
    }
    .neon-solid:hover { background: #1aad5a; border-color: #1aad5a; }
    .neon-solid .btn-circle { background: white; color: #25D366; }

    /* Ghost (secondary outline) */
    .neon-ghost {
      background: transparent;
      border-color: rgba(14,42,71,0.35);
      color: #0E2A47;
    }
    .neon-ghost:hover {
      border-color: #0E2A47;
      background: rgba(14,42,71,0.04);
    }
    .neon-ghost .btn-circle { background: #0E2A47; color: white; }

    /* Default (light blue) */
    .neon-default {
      background: #F4F8FB;
      border-color: #E5EBF1;
      color: #0E2A47;
    }
    .neon-default:hover { background: #eaf2f8; }
    .neon-default .btn-circle { background: #4FB3D9; color: white; }

    /* Medium size */
    .neon-md {
      font-size: 14px;
      padding: 9px 52px 9px 20px;
    }
    .neon-md:hover { padding: 9px 20px 9px 52px; }
    .neon-md .btn-circle { width: 34px; height: 34px; right: 6px; top: 50%; transform: translateY(-50%); }
    .neon-md:hover .btn-circle { right: calc(100% - 40px); }
    .neon-md .btn-circle svg { width: 13px; height: 13px; }

    /* Large size */
    .neon-lg {
      font-size: 15px;
      padding: 11px 60px 11px 26px;
    }
    .neon-lg:hover { padding: 11px 26px 11px 60px; }
    .neon-lg .btn-circle { width: 40px; height: 40px; right: 6px; top: 50%; transform: translateY(-50%); }
    .neon-lg:hover .btn-circle { right: calc(100% - 46px); }
    .neon-lg .btn-circle svg { width: 14px; height: 14px; }
    @media (max-width: 640px) {
      .neon-btn:not(.neon-block) { width: 100%; justify-content: center; }
    }
  </style>
</head>
